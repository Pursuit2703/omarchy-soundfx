# Razer Surround HRIR (from HeSuVi set) as 8ch->stereo virtual surround. Second sink, default untouched.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Razer Surround 7.1"
      media.name = "Razer Surround 7.1"
      filter.graph = {
        nodes = [
          { type = builtin label = copy name = copyFL }
          { type = builtin label = copy name = copyFR }
          { type = builtin label = copy name = copyFC }
          { type = builtin label = copy name = copyLFE }
          { type = builtin label = copy name = copyRL }
          { type = builtin label = copy name = copyRR }
          { type = builtin label = copy name = copySL }
          { type = builtin label = copy name = copySR }
          { type = builtin label = convolver name = cFL_L config = { filename = "@HRIR@" channel = 0 } }
          { type = builtin label = convolver name = cFL_R config = { filename = "@HRIR@" channel = 1 } }
          { type = builtin label = convolver name = cFR_L config = { filename = "@HRIR@" channel = 1 } }
          { type = builtin label = convolver name = cFR_R config = { filename = "@HRIR@" channel = 0 } }
          { type = builtin label = convolver name = cFC_L config = { filename = "@HRIR@" channel = 6 } }
          { type = builtin label = convolver name = cFC_R config = { filename = "@HRIR@" channel = 6 } }
          { type = builtin label = convolver name = cLFE_L config = { filename = "@HRIR@" channel = 6 } }
          { type = builtin label = convolver name = cLFE_R config = { filename = "@HRIR@" channel = 6 } }
          { type = builtin label = convolver name = cRL_L config = { filename = "@HRIR@" channel = 4 } }
          { type = builtin label = convolver name = cRL_R config = { filename = "@HRIR@" channel = 5 } }
          { type = builtin label = convolver name = cRR_L config = { filename = "@HRIR@" channel = 5 } }
          { type = builtin label = convolver name = cRR_R config = { filename = "@HRIR@" channel = 4 } }
          { type = builtin label = convolver name = cSL_L config = { filename = "@HRIR@" channel = 2 } }
          { type = builtin label = convolver name = cSL_R config = { filename = "@HRIR@" channel = 3 } }
          { type = builtin label = convolver name = cSR_L config = { filename = "@HRIR@" channel = 3 } }
          { type = builtin label = convolver name = cSR_R config = { filename = "@HRIR@" channel = 2 } }
          { type = builtin label = mixer name = mixL }
          { type = builtin label = mixer name = mixR }
          { type = builtin label = bq_lowshelf name = bassL control = { "Freq" = 120.0 "Q" = 0.7 "Gain" = 3.0 } }
          { type = builtin label = bq_lowshelf name = bassR control = { "Freq" = 120.0 "Q" = 0.7 "Gain" = 3.0 } }
        ]
        links = [
          { output = "copyFL:Out" input = "cFL_L:In" }
          { output = "cFL_L:Out" input = "mixL:In 1" }
          { output = "copyFL:Out" input = "cFL_R:In" }
          { output = "cFL_R:Out" input = "mixR:In 1" }
          { output = "copyFR:Out" input = "cFR_L:In" }
          { output = "cFR_L:Out" input = "mixL:In 2" }
          { output = "copyFR:Out" input = "cFR_R:In" }
          { output = "cFR_R:Out" input = "mixR:In 2" }
          { output = "copyFC:Out" input = "cFC_L:In" }
          { output = "cFC_L:Out" input = "mixL:In 3" }
          { output = "copyFC:Out" input = "cFC_R:In" }
          { output = "cFC_R:Out" input = "mixR:In 3" }
          { output = "copyLFE:Out" input = "cLFE_L:In" }
          { output = "cLFE_L:Out" input = "mixL:In 4" }
          { output = "copyLFE:Out" input = "cLFE_R:In" }
          { output = "cLFE_R:Out" input = "mixR:In 4" }
          { output = "copyRL:Out" input = "cRL_L:In" }
          { output = "cRL_L:Out" input = "mixL:In 5" }
          { output = "copyRL:Out" input = "cRL_R:In" }
          { output = "cRL_R:Out" input = "mixR:In 5" }
          { output = "copyRR:Out" input = "cRR_L:In" }
          { output = "cRR_L:Out" input = "mixL:In 6" }
          { output = "copyRR:Out" input = "cRR_R:In" }
          { output = "cRR_R:Out" input = "mixR:In 6" }
          { output = "copySL:Out" input = "cSL_L:In" }
          { output = "cSL_L:Out" input = "mixL:In 7" }
          { output = "copySL:Out" input = "cSL_R:In" }
          { output = "cSL_R:Out" input = "mixR:In 7" }
          { output = "copySR:Out" input = "cSR_L:In" }
          { output = "cSR_L:Out" input = "mixL:In 8" }
          { output = "copySR:Out" input = "cSR_R:In" }
          { output = "cSR_R:Out" input = "mixR:In 8" }
          { output = "mixL:Out" input = "bassL:In" }
          { output = "mixR:Out" input = "bassR:In" }
        ]
        inputs  = [ "copyFL:In" "copyFR:In" "copyFC:In" "copyLFE:In" "copyRL:In" "copyRR:In" "copySL:In" "copySR:In" ]
        outputs = [ "bassL:Out" "bassR:Out" ]
      }
      capture.props = {
        node.name = "effect_input.razer_surround_7_1"
        media.class = Audio/Sink
        audio.channels = 8
        audio.position = [ FL FR FC LFE RL RR SL SR ]
      }
      playback.props = {
        node.name = "effect_output.razer_surround_7_1"
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
        stream.dont-remix = true
      }
    }
  }
]
